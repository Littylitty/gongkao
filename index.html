<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>备考记录册</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

:root{
  --paper:#F7F1E4; --paper-deep:#EFE6D2; --ink:#211F1A; --ink-soft:#6B6457; --ink-btn:#4D4843;
  --red:#C13B2F; --red-soft:#E7C9C4; --blue:#2F5A78; --blue-soft:#CBD9E1;
  --gold:#B08B2E; --card:#FFFEFA; --border:#E3DCC9;
}
*{box-sizing:border-box;}
.zfk-root{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--paper);
  background-image:repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-deep) 27px 28px);
  min-height:100vh; width:100%; padding-bottom:48px;
}
.zfk-header{
  background:var(--card); border-bottom:3px double var(--ink);
  padding:18px 20px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
}
.zfk-brand-row{display:flex; align-items:center; gap:12px;}
.zfk-seal{
  width:46px; height:46px; border:2px solid var(--red); border-radius:8px; color:var(--red);
  display:flex; align-items:center; justify-content:center; font-family:"Noto Serif SC",serif;
  font-weight:700; font-size:13px; line-height:1.1; text-align:center; transform:rotate(-6deg);
  flex-shrink:0; letter-spacing:1px;
}
.zfk-title{font-family:"Noto Serif SC",serif; font-weight:700; font-size:21px; margin:0; letter-spacing:0.5px;}
.zfk-subtitle{font-size:12px; color:var(--ink-soft); margin:3px 0 0;}
.zfk-streak{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--gold); font-weight:600; white-space:nowrap;}
.zfk-tabs{display:flex; gap:2px; overflow-x:auto; padding:0 12px; background:var(--card); border-bottom:1px solid var(--border);}
.zfk-tab{
  display:flex; align-items:center; gap:6px; padding:11px 13px; font-size:13px; font-weight:500;
  color:var(--ink-soft); border:none; background:none; cursor:pointer; white-space:nowrap;
  border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
}
.zfk-tab.active{color:var(--red); border-bottom-color:var(--red); font-weight:700;}
.zfk-tab:hover{color:var(--ink);}
.zfk-main{max-width:760px; margin:0 auto; padding:18px 16px 8px;}
.zfk-card{
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(33,31,26,0.04);
}
.zfk-section-title{
  font-family:"Noto Serif SC",serif; font-size:15px; font-weight:700; margin:0 0 12px;
  display:flex; align-items:center; gap:7px; color:var(--ink);
}
.zfk-section-sub{font-size:12px; color:var(--ink-soft); margin:-8px 0 12px;}
.zfk-btn{
  border:1px solid var(--ink-btn); background:var(--card); color:var(--ink-btn); border-radius:7px;
  padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex;
  align-items:center; gap:6px; transition:transform .1s, opacity .15s;
}
.zfk-btn:hover{opacity:0.85;}
.zfk-btn:active{transform:scale(0.97);}
.zfk-btn:disabled{opacity:0.5; cursor:not-allowed;}
.zfk-btn-primary{background:var(--ink-btn); color:var(--paper); border-color:var(--ink-btn);}
.zfk-btn-red{background:var(--red); color:#fff; border-color:var(--red);}
.zfk-btn-blue{background:var(--blue); color:#fff; border-color:var(--blue);}
.zfk-btn-ghost{background:transparent; border-color:var(--border); color:var(--ink-soft);}
.zfk-btn-sm{padding:5px 10px; font-size:12px;}
.zfk-btn-block{width:100%; justify-content:center;}
.zfk-input,.zfk-textarea,.zfk-select{
  width:100%; border:1px solid var(--border); border-radius:7px; padding:9px 11px; font-size:13px;
  font-family:inherit; background:#fff; color:var(--ink);
}
.zfk-textarea{resize:vertical; min-height:74px; line-height:1.55;}
.zfk-label{font-size:12px; color:var(--ink-soft); font-weight:600; margin:0 0 5px; display:block;}
.zfk-field{margin-bottom:12px;}
.zfk-row{display:flex; gap:10px; align-items:flex-end;}
.zfk-row > *{flex:1;}
.zfk-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.zfk-status-toggle{display:flex; gap:8px;}
.zfk-status-btn{
  flex:1; border:1.5px solid var(--border); border-radius:7px; padding:8px 6px; background:#fff;
  font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; display:flex;
  align-items:center; justify-content:center; gap:5px; transition:all .12s;
}
.zfk-status-btn.sel-correct{border-color:var(--blue); color:var(--blue); background:var(--blue-soft);}
.zfk-status-btn.sel-wrong{border-color:var(--red); color:var(--red); background:var(--red-soft);}
.zfk-status-btn.sel-pending{border-color:var(--gold); color:var(--gold); background:#F3E9D2;}
.zfk-upload-zone{
  border:2px dashed var(--border); border-radius:10px; padding:26px 14px; text-align:center;
  cursor:pointer; color:var(--ink-soft); transition:border-color .15s, background .15s;
}
.zfk-upload-zone:hover{border-color:var(--red); background:#FCF8EE;}
.zfk-preview-img{max-width:100%; max-height:220px; border-radius:8px; border:1px solid var(--border); display:block; margin:0 auto 10px;}
.zfk-badge{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px;
  border-radius:20px; line-height:1.6;
}
.zfk-badge-correct{background:var(--blue-soft); color:var(--blue);}
.zfk-badge-wrong{background:var(--red-soft); color:var(--red);}
.zfk-badge-pending{background:#F3E9D2; color:var(--gold);}
.zfk-pill{
  display:inline-flex; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px;
  background:var(--paper-deep); color:var(--ink-soft); border:1px solid var(--border);
}
.zfk-list-item{
  border-bottom:1px solid var(--border); padding:11px 0; display:flex; flex-direction:column; gap:5px;
}
.zfk-list-item:last-child{border-bottom:none;}
.zfk-list-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:space-between;}
.zfk-list-meta{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.zfk-list-content{font-size:13px; line-height:1.6; color:var(--ink); white-space:pre-wrap;}
.zfk-list-actions{display:flex; gap:6px; flex-shrink:0;}
.zfk-icon-btn{
  border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:3px; display:flex;
  align-items:center; border-radius:5px;
}
.zfk-icon-btn:hover{color:var(--red); background:var(--paper-deep);}
.zfk-empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}
.zfk-stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;}
.zfk-stat-card{
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 8px;
  text-align:center;
}
.zfk-stat-number{
  font-family:"SF Mono",Consolas,monospace; font-size:21px; font-weight:700; color:var(--ink);
  display:block; line-height:1.1;
}
.zfk-stat-label{font-size:11px; color:var(--ink-soft); margin-top:4px; display:block;}
.zfk-progress-track{height:8px; background:var(--paper-deep); border-radius:5px; overflow:hidden;}
.zfk-progress-fill{height:100%; border-radius:5px; background:var(--red); transition:width .3s;}
.zfk-cat-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.zfk-cat-row .zfk-cat-name{width:108px; font-size:12.5px; flex-shrink:0; color:var(--ink-soft);}
.zfk-cat-row .zfk-cat-track{flex:1;}
.zfk-cat-row .zfk-cat-val{width:64px; text-align:right; font-size:12px; font-family:"SF Mono",Consolas,monospace; color:var(--ink-soft); flex-shrink:0;}
.zfk-tally-row{
  display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border);
}
.zfk-tally-row:last-child{border-bottom:none;}
.zfk-tally-name{flex:1; font-size:13px; font-weight:600;}
.zfk-tally-count{font-family:"SF Mono",Consolas,monospace; font-size:12px; color:var(--ink-soft); min-width:74px; text-align:center;}
.zfk-counter-btn{
  width:30px; height:30px; border-radius:8px; border:1.5px solid var(--border); background:#fff;
  font-weight:700; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.zfk-counter-btn.correct{border-color:var(--blue); color:var(--blue);}
.zfk-counter-btn.wrong{border-color:var(--red); color:var(--red);}
.zfk-counter-btn:active{transform:scale(0.92);}
.zfk-session-card{
  border:1px solid var(--border); border-radius:9px; padding:13px; margin-bottom:10px; cursor:pointer;
  background:#fff; transition:border-color .15s;
}
.zfk-session-card:hover{border-color:var(--ink-soft);}
.zfk-session-card.active{border-color:var(--gold); background:#FDF9EE;}
.zfk-cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px;}
.zfk-cal-weekdays span{text-align:center; font-size:11px; color:var(--ink-soft); font-weight:600;}
.zfk-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.zfk-cal-cell{
  aspect-ratio:1; border-radius:7px; border:1px solid var(--border); display:flex; flex-direction:column;
  align-items:center; justify-content:center; cursor:pointer; font-size:12px; gap:2px; background:#fff;
  position:relative;
}
.zfk-cal-cell.empty{visibility:hidden;}
.zfk-cal-cell.today{border-color:var(--ink-btn); border-width:2px;}
.zfk-cal-daynum{font-weight:700; font-family:"SF Mono",Consolas,monospace; font-size:12px;}
.zfk-cal-frac{font-size:9px; color:var(--ink-soft);}
.zfk-modal-overlay{
  position:fixed; inset:0; background:rgba(33,31,26,0.45); display:flex; align-items:center;
  justify-content:center; z-index:50; padding:16px;
}
.zfk-modal{
  background:var(--paper); border-radius:12px; max-width:420px; width:100%; max-height:85vh;
  overflow-y:auto; padding:18px; border:1px solid var(--border); position:relative;
}
.zfk-modal-close{position:absolute; top:12px; right:12px; cursor:pointer; color:var(--ink-soft); background:none; border:none;}
.zfk-chart-wrap{width:100%; height:230px;}
.zfk-toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink-btn); color:var(--paper);
  padding:9px 18px; border-radius:20px; font-size:12.5px; z-index:60; box-shadow:0 3px 10px rgba(0,0,0,0.2);
}
.zfk-loading-wrap{display:flex; align-items:center; justify-content:center; min-height:60vh; flex-direction:column; gap:10px; color:var(--ink-soft);}
.zfk-spin{animation:zfk-spin 1s linear infinite;}
@keyframes zfk-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.zfk-segment{display:flex; gap:6px; margin-bottom:12px;}
.zfk-segment button{
  border:1px solid var(--border); background:#fff; padding:5px 12px; font-size:12px; border-radius:20px;
  cursor:pointer; color:var(--ink-soft);
}
.zfk-segment button.active{background:var(--ink-btn); color:var(--paper); border-color:var(--ink-btn);}
.zfk-cat-tag{
  font-size:11px; border:1px solid var(--border); border-radius:20px; padding:3px 9px; background:#fff;
  cursor:pointer; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px;
}
.zfk-cat-tag.active{background:var(--paper-deep); color:var(--ink); border-color:var(--ink-soft); font-weight:600;}
.zfk-tag-list{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
@media (max-width:480px){
  .zfk-stat-grid{grid-template-columns:repeat(2,1fr);}
  .zfk-cat-row .zfk-cat-name{width:78px; font-size:11.5px;}
  .zfk-title{font-size:18px;}
}

/* ---- V3 新增样式 ---- */
:root{ --hl:#FAE08C; }
.zfk-mini-label{font-size:11px;color:var(--ink-soft);}
.zfk-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
.zfk-tab{white-space:nowrap;}
.zfk-rt-toolbar{display:flex;gap:4px;margin-bottom:6px;}
.zfk-rt-btn{width:30px;height:28px;border:1px solid var(--border);background:var(--card);border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink);line-height:1;padding:0;}
.zfk-rt-btn:hover{border-color:var(--ink-soft);}
.zfk-rich{min-height:60px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.6;background:var(--card);outline:none;}
.zfk-rich:focus{border-color:var(--blue);}
.zfk-rich mark, .zfk-rich-view mark{background:var(--hl);padding:0 1px;}
.zfk-rich-view{word-break:break-word;}
.zfk-abcd{display:flex;gap:8px;}
.zfk-abcd-btn{width:42px;height:38px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink);}
.zfk-abcd-btn.sel-my{background:var(--blue);color:#fff;border-color:var(--blue);}
.zfk-abcd-btn.sel-correct{background:var(--red);color:#fff;border-color:var(--red);}
.zfk-chip{font-size:12px;padding:4px 11px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--ink-soft);cursor:pointer;margin:0 6px 6px 0;}
.zfk-chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.zfk-ref-answer{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--paper);}
.zfk-exam-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);}
.zfk-exam-dates{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-top:8px;}
.zfk-exam-date{font-size:12px;color:var(--ink-soft);}
.zfk-exam-date b{color:var(--ink);font-weight:600;}
.zfk-countdown{display:inline-block;font-size:11px;color:#fff;background:var(--red);border-radius:10px;padding:1px 9px;margin-left:8px;vertical-align:middle;font-weight:500;}
.zfk-modal{max-height:88vh;overflow-y:auto;}
.zfk-sel-popup{position:absolute;z-index:9999;background:var(--ink-btn);color:var(--paper);border:none;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap;}
@media (max-width:480px){ .zfk-exam-dates{grid-template-columns:1fr;} }

/* ---- V4：侧边栏布局 + 本地模型 + 批改 + 备份 ---- */
.zfk-shell{display:flex;min-height:100vh;align-items:stretch;}
.zfk-sidebar{flex:0 0 168px;width:168px;background:var(--card);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;align-self:flex-start;height:100vh;box-sizing:border-box;overflow-y:auto;}
.zfk-sidebar .zfk-brand-row{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:14px;}
.zfk-sidebar .zfk-title{font-size:17px;}
.zfk-sidebar .zfk-subtitle{font-size:10.5px;}
.zfk-nav{display:flex;flex-direction:column;gap:4px;}
.zfk-nav-item{text-align:left;background:transparent;border:none;border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.zfk-nav-item:hover{background:var(--paper-deep);color:var(--ink);}
.zfk-nav-item.active{background:var(--red);color:#fff;font-weight:600;}
.zfk-content{flex:1;min-width:0;display:flex;flex-direction:column;}
.zfk-topbar{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:30;}
.zfk-burger{font-size:20px;background:none;border:none;cursor:pointer;color:var(--ink);line-height:1;}
.zfk-topbar-title{font-weight:600;font-size:15px;}
.zfk-nav-scrim{display:none;}
.zfk-thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--border);flex:none;margin-right:4px;}
.zfk-attach-img{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--border);margin-top:8px;display:block;}
.zfk-grade-box{margin-top:8px;padding:8px 10px;border:1px dashed var(--red);border-radius:8px;background:rgba(193,59,47,.04);}
.zfk-grade-box s,.zfk-rich-view s{color:var(--ink-soft);}
.zfk-grade-comment{margin-top:6px;font-size:12px;color:var(--ink);background:var(--paper-deep);border-radius:6px;padding:6px 8px;}
@media (max-width:760px){
  .zfk-sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .22s;box-shadow:0 0 24px rgba(0,0,0,.2);}
  .zfk-sidebar.open{transform:translateX(0);}
  .zfk-topbar{display:flex;}
  .zfk-nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:45;}
}

/* ---- V5：首页 / 错题三栏 / 紧凑标签 / 打印 ---- */
.zfk-main-wide{max-width:1080px;}
.zfk-home-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start;}
.zfk-home-countdown{background:linear-gradient(135deg,#F2DAD3,#E9C6BD);color:#8A2B22;border-radius:12px;padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:18px;}
.zfk-cd-left{flex:1;min-width:0;padding-left:16px;}
.zfk-cd-right{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;margin-right:30px;}
.zfk-cd-numbox{font-family:"Noto Serif SC",serif;font-size:46px;font-weight:700;line-height:1;letter-spacing:1px;white-space:nowrap;}
.cd-date{font-size:13px;color:inherit;opacity:.85;margin-top:8px;}
.zfk-cd-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:inherit;}
.zfk-cd-status{font-size:11px;opacity:.85;color:inherit;margin-left:-3px;}
.zfk-cd-dot{opacity:.55;}
.zfk-cd-cloud{cursor:pointer;font-size:17px;line-height:1;color:inherit;}
.zfk-cd-cloud.busy{opacity:.5;}
.zfk-home-countdown .cd-label{font-size:14px;opacity:.95;}
.zfk-cd-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;}
.zfk-cd-icon{background:none;border:none;color:#fff;cursor:pointer;font-size:16px;line-height:1;padding:2px;opacity:.92;}
.zfk-cd-icon:hover{opacity:1;}
.zfk-cd-icon:disabled{opacity:.5;}
.zfk-cd-btn:hover{background:rgba(255,255,255,.3);}
.zfk-home-countdown.empty{background:var(--paper-deep);color:var(--ink-soft);}
.zfk-jump-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.zfk-jump-btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:12px 6px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
.zfk-jump-btn:hover{border-color:var(--red);color:var(--red);}
.zfk-jump-btn .ji{font-size:18px;}
.zfk-scroll-box{max-height:240px;overflow-y:auto;}
.zfk-wrong-layout{display:grid;grid-template-columns:230px 1fr 280px;gap:12px;align-items:start;}
.zfk-wrong-list{max-height:74vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px;background:var(--card);}
.zfk-wlist-item{padding:10px 11px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:8px;align-items:flex-start;}
.zfk-wlist-item:last-child{border-bottom:none;}
.zfk-wlist-item.sel{background:var(--paper-deep);border-left:3px solid var(--red);}
.zfk-wlist-item.mastered{opacity:.55;}
.zfk-wlist-title{font-size:12.5px;line-height:1.4;color:var(--ink);flex:1;min-width:0;}
.zfk-wlist-sub{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
.zfk-star{cursor:pointer;font-size:15px;line-height:1;color:var(--border);background:none;border:none;padding:0;flex:none;}
.zfk-star.on{color:var(--gold);}
.zfk-wrong-detail{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:16px;min-height:200px;}
.zfk-wrong-notes{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:14px;position:sticky;top:10px;}

function setupSelectionPopup() {
  var host = document.createElement("div"); host.id = "zfk-sel-popup-host"; document.body.appendChild(host);
  document.addEventListener("mouseup", function () { setTimeout(handleSelection, 10); });
  document.addEventListener("selectionchange", function () { /* noop, handled on mouseup */ });
}
function handleSelection() {
  var host = document.getElementById("zfk-sel-popup-host"); if (!host) return;
  var sel = window.getSelection && window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { host.innerHTML = ""; return; }
  var text = (sel.toString() || "").trim();
  if (!text) { host.innerHTML = ""; return; }
  var node = sel.anchorNode; var inSelectable = false;
  while (node) { if (node.nodeType === 1 && node.classList && node.classList.contains("zfk-selectable")) { inSelectable = true; break; } node = node.parentNode; }
  if (!inSelectable) { host.innerHTML = ""; return; }
  var rect; try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) { return; }
  host.innerHTML = '<button id="zfk-sel-btn" class="zfk-sel-popup">＋ 加入素材库</button>';
  var btn = document.getElementById("zfk-sel-btn");
  btn.style.top = (window.scrollY + rect.top - 40) + "px";
  btn.style.left = (window.scrollX + rect.left) + "px";
  btn.addEventListener("click", function () {
    ui.tab = "material"; openMatForm({ html: esc(text) }); host.innerHTML = ""; render();
    flash("已带入选中文字，补全标签后保存");
  });
}

document.addEventListener("paste", function (e) {
  var sel = window.getSelection && window.getSelection();
  var node = sel && sel.anchorNode; if (node && node.nodeType === 3) node = node.parentNode;
  var ed = node && node.closest ? node.closest(".zfk-rich") : null;
  if (!ed) { var t = e.target; if (t && t.nodeType === 3) t = t.parentNode; ed = t && t.closest ? t.closest(".zfk-rich") : null; }
  if (!ed) return;
  var cd = e.clipboardData || window.clipboardData;
  var text = cd ? (cd.getData("text/plain") || cd.getData("text") || "") : "";
  if (!text) {
    // 通用剪贴板(跨设备拷贝)有时同步取不到纯文本，此时不要阻止默认，交给浏览器原生粘贴，
    // 保存时会自动清洗 HTML，避免出现“粘贴无反应”。
    return;
  }
  e.preventDefault();
  if (sel && sel.rangeCount && ed.contains(sel.anchorNode)) {
    var range = sel.getRangeAt(0); range.deleteContents();
    var tn = document.createTextNode(text); range.insertNode(tn);
    range.setStartAfter(tn); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
  } else { ed.appendChild(document.createTextNode(text)); }
}, false);
document.addEventListener("click", function (e) {
  var rt = e.target.closest ? e.target.closest("[data-rt]") : null;
  if (rt) { e.preventDefault(); applyRT(rt.getAttribute("data-rt"), rt.getAttribute("data-target")); return; }
  var el = e.target.closest ? e.target.closest("[data-act]") : null; if (!el) return;
  if (el.tagName === "INPUT" && el.type === "color") return; // 取色器：让它原生打开，拖动时不重渲染
  var act = el.getAttribute("data-act");
  if (act === "modal-close-bg" && e.target.closest && e.target.closest("[data-stop]")) return;
  if (act === "task-toggle") return;
  handleAction(act, el.getAttribute("data-arg"));
});
function applyColorTarget(t) {
  var act = t.getAttribute && t.getAttribute("data-act");
  if (act === "set-tasktype-color") { state.taskTypeColors[t.getAttribute("data-arg")] = t.value; }
  else if (act === "set-cd-color") { state.settings["cdColor" + t.getAttribute("data-arg")] = t.value; }
  else return false;
  var sw = t.closest ? t.closest("label") : null; if (sw) sw.style.background = t.value; // 实时反映到色块，不整页重渲染
  saveState(); // 仅防抖持久化/同步，避免拖动时销毁取色器
  return true;
}
document.addEventListener("input", function (e) {
  var t = e.target; if (t && t.type === "color") applyColorTarget(t);
});
document.addEventListener("focusout", function (e) {
  var t = e.target; if (t && t.type === "color" && (t.getAttribute("data-act") === "set-cd-color" || t.getAttribute("data-act") === "set-tasktype-color")) { applyColorTarget(t); render(); } // 取色器关闭后再整页刷新

document.addEventListener("change", function (e) {

  if (t.id === "qf-file") { var f = t.files && t.files[0]; if (f) handleQFormFile(f, qForm && qForm.pendingAI); return; }

/* ===================== 云端同步（GitHub Gist） ===================== */
var GIST_FILE = "beikao-records.json";
function syncConfigured() { return !!(state.settings && state.settings.githubToken && state.settings.gistId); }
function syncStatusText() {
  if (!state.settings.githubToken) return "未配置";
  if (!state.settings.gistId) return "已填 Token，待创建/连接云端";
  var t = ui.syncTime ? new Date(ui.syncTime).toLocaleTimeString() : "—";
  if (ui.syncState === "err") return "上次同步失败（" + t + "）";
  if (ui.syncState === "ok") return "已同步 · " + t;
  return "已连接，等待同步";
}
async function cloudPush(silent) {
  if (!state.settings.githubToken) { if (!silent) flash("请先填写 GitHub Token"); return; }
  var clone = JSON.parse(JSON.stringify(state));
  if (clone.settings) { delete clone.settings.githubToken; delete clone.settings.gistId; }
  var files = {}; files[GIST_FILE] = { content: JSON.stringify(clone) };
  var id = state.settings.gistId;
  var body = { description: "备考记录册数据备份", files: files }; if (!id) body.public = false;
  try {
    var resp = await fetch(id ? "https://api.github.com/gists/" + id : "https://api.github.com/gists", {
      method: id ? "PATCH" : "POST",
      headers: { "Authorization": "Bearer " + state.settings.githubToken, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + (resp.status === 401 ? "（Token 无效）" : ""));
    var j = await resp.json();
    if (!id && j.id) { state.settings.gistId = j.id; persistLocal(); }
    ui.syncState = "ok"; ui.syncTime = Date.now();
    if (!silent) { flash("已上传到云端"); render(); }
  } catch (e) { ui.syncState = "err"; if (!silent) { flash("上传失败：" + syncErrHint(e)); render(); } }
}
async function cloudPull(silent, force) {
  if (!syncConfigured()) { if (!silent) flash("请先填写 Token 和 Gist ID"); return; }
  try {
    var resp = await fetch("https://api.github.com/gists/" + state.settings.gistId, {
      headers: { "Authorization": "Bearer " + state.settings.githubToken, "Accept": "application/vnd.github+json" }
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + (resp.status === 401 ? "（Token 无效或无 Gists 权限）" : resp.status === 404 ? "（Gist ID 不存在或 Token 无权访问）" : ""));
    var j = await resp.json();
    var f = j.files && j.files[GIST_FILE]; if (!f) throw new Error("云端无数据文件");
    var content = f.content;
    if (f.truncated && f.raw_url) { var r2 = await fetch(f.raw_url, { headers: { "Authorization": "Bearer " + state.settings.githubToken } }); content = await r2.text(); }
    var remote = JSON.parse(content);
    var rT = (remote.meta && remote.meta.updatedAt) || 0, lT = (state.meta && state.meta.updatedAt) || 0;
    if (!force && rT <= lT) { ui.syncState = "ok"; ui.syncTime = Date.now(); if (!silent) { flash("本地已是最新"); render(); } return; }
    var keep = { githubToken: state.settings.githubToken, gistId: state.settings.gistId };
    state = migrate(remote);
    state.settings.githubToken = keep.githubToken; state.settings.gistId = keep.gistId;
    persistLocal();
    ui.syncState = "ok"; ui.syncTime = Date.now();
    if (!silent) flash("已从云端同步"); render();
  } catch (e) { ui.syncState = "err"; if (!silent) { flash("下载失败：" + syncErrHint(e)); render(); } }
}
function syncErrHint(e) {
  var msg = (e && e.message) || String(e);
  if (msg.indexOf("HTTP") < 0) msg += "（网络请求被拦截：常见于以本地文件方式打开本页时，iPad/iPhone 浏览器会阻止访问 GitHub。可改用「数据备份」导入，或把本页放到网址下访问）";
  return msg;
}
async function cloudSyncNow() {
  if (!syncConfigured()) { flash("请先在「设置」开启云端同步"); return; }
  ui.syncBusy = true; render();
  try { await cloudPull(true, false); await cloudPush(true); ui.syncState = "ok"; ui.syncTime = Date.now(); flash("已同步"); }
  catch (e) { ui.syncState = "err"; flash("同步失败：" + (e.message || e)); }
  finally { ui.syncBusy = false; render(); }
}
function exportData() {
  try {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = "备考记录册备份-" + todayKey() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    flash("已导出备份文件");
  } catch (e) { flash("导出失败：" + (e.message || e)); }
}
function importData(file) {
  var reader = new FileReader();
  reader.onload = function (e) {
    try { var obj = JSON.parse(e.target.result); state = migrate(obj); commit(); flash("已导入备份"); }
    catch (err) { flash("导入失败：文件格式不正确"); }
  };
  reader.readAsText(file);
}
